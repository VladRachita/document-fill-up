[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docfill"
version = "0.1.0"
description = "Scan documents (PDF, Word, images), sanitize them, extract personal data with ML and fill standard documents exported as PDF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Reading / scanning
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    # Sanitization
    "ftfy>=6.1",
    # Machine learning (named-entity recognition)
    "spacy>=3.7,<4",
    "pycountry>=23.12",
    # Standard documents storage
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    # PDF export
    "reportlab>=4.0",
    # App plumbing
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
docfill = "docfill.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docfill = ["py.typed", "standard_documents/*.yaml", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Emitted by recent Starlette test clients; not actionable from this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
