name: residence-declaration
title: Declarație privind domiciliul
description: >
  Declarație pe propria răspundere privind adresa de domiciliu a unei persoane. Folosește
  numele persoanei și adresa completă de domiciliu.
kind: text
optional_fields:
  - region
body: |
  # DECLARAȚIE PE PROPRIA RĂSPUNDERE PRIVIND DOMICILIUL

  Subsemnatul(a) {{ last_name | upper }} {{ first_name }}, declar pe propria răspundere că
  domiciliul meu este la adresa:

  Strada și numărul: {{ street_address }}
  Cod poștal: {{ postal_code }}
  Localitatea: {{ city }}
  Județul / sectorul: {{ region }}
  Țara: {{ country }}

  Confirm că informațiile de mai sus sunt reale și complete, cunoscând prevederile
  art. 326 din Codul penal privind falsul în declarații.

  ---

  Data: {{ today }}

  Semnătura: ____________________
