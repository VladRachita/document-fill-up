  bo_filed_by:
    reprezentantul legal: 07Box1111
    împuternicit: Box121

# The address of an identity card is the domicile ("domiciliu" box of each block).
ticks:
  Box5: [beneficial_owner]
  Box8: [p2_beneficial_owner]
  Box10: [p3_beneficial_owner]

# A block of the declaration is printed only for a person who is a beneficial owner.
filled_when:
  beneficial_owner:
    ["13", "13_2", "14", "15", "16", "20", "21", "21_2", "21_3", "19", "17", "18", "25", "26",
     "27", "28", "22", "23", "29", "24"]
  p2_beneficial_owner:
    ["33", "31", "34", "30", "32", "32_2", "32_3", "41", "43", "35", "36", "37", "58", "44",
     "45", "47", "47_2", "47_3", "39", "40"]
  p3_beneficial_owner:
    ["46", "50", "42_2", "49", "42", "62", "48", "48_2", "51", "54", "56", "55", "52", "53",
     "59", "60", "60_2", "60_3", "57", "52_2"]

