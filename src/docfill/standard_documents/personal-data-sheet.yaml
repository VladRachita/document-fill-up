name: personal-data-sheet
title: Fișă cu datele personale
description: >
  Fișă rezumat cu datele de identitate ale unei persoane și adresa de domiciliu.
kind: text
optional_fields:
  - place_of_birth
  - region
body: |
  # FIȘĂ CU DATELE PERSONALE

  ## Identitate

  Nume: {{ last_name | upper }}
  Prenume: {{ first_name }}
  Locul nașterii: {{ place_of_birth }}

  ## Adresa de domiciliu

  {{ full_address }}

  Localitatea: {{ city }}
  Județul / sectorul: {{ region }}
  Țara: {{ country }}

  ---

  Generată la data de {{ today }}.
